```yaml
name: Website SEO and Build Check

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 1"

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and SEO Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Check SEO source files
        shell: bash
        run: |
          set -e

          test -f app/robots.ts || {
            echo "ERROR: app/robots.ts is missing"
            exit 1
          }

          test -f app/sitemap.ts || {
            echo "ERROR: app/sitemap.ts is missing"
            exit 1
          }

          echo "SUCCESS: SEO source files exist."

      - name: Check Next.js build output
        shell: bash
        run: |
          set -e

          test -d .next/server/app || {
            echo "ERROR: Next.js server build output was not found."
            exit 1
          }

          echo "SUCCESS: Next.js build output exists."

      - name: Check live website pages
        shell: bash
        run: |
          set -u

          BASE_URL="https://www.krachtklusbedrijf-ms.nl"

          PAGES=(
            "/"
            "/elst"
            "/renovatie"
            "/schilderwerk"
            "/vloeren"
            "/badkamer-renovatie"
            "/isolatie"
            "/zolder-renovatie"
            "/arnhem"
            "/nijmegen"
            "/bemmel"
            "/huissen"
            "/lent"
            "/oosterbeek"
            "/projecten"
          )

          FAILED=0

          for PAGE in "${PAGES[@]}"; do
            URL="${BASE_URL}${PAGE}"

            STATUS=$(curl -sS -L \
              --max-time 20 \
              -o /dev/null \
              -w "%{http_code}" \
              "$URL") || STATUS="000"

            if [ "$STATUS" = "200" ]; then
              echo "PASS: $URL ($STATUS)"
            else
              echo "FAIL: $URL ($STATUS)"
              FAILED=1
            fi
          done

          for FILE in robots.txt sitemap.xml; do
            URL="${BASE_URL}/${FILE}"

            STATUS=$(curl -sS -L \
              --max-time 20 \
              -o /dev/null \
              -w "%{http_code}" \
              "$URL") || STATUS="000"

            if [ "$STATUS" = "200" ]; then
              echo "PASS: $URL ($STATUS)"
            else
              echo "FAIL: $URL ($STATUS)"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: One or more live website checks failed."
            exit 1
          fi

          echo "SUCCESS: All live website pages are accessible."

      - name: Check page titles and meta descriptions
        shell: bash
        run: |
          set -u

          BASE_URL="https://www.krachtklusbedrijf-ms.nl"

          PAGES=(
            "/"
            "/elst"
            "/renovatie"
            "/schilderwerk"
            "/vloeren"
            "/badkamer-renovatie"
            "/isolatie"
            "/zolder-renovatie"
            "/arnhem"
            "/nijmegen"
            "/bemmel"
            "/huissen"
            "/lent"
            "/oosterbeek"
            "/projecten"
          )

          FAILED=0

          for PAGE in "${PAGES[@]}"; do
            URL="${BASE_URL}${PAGE}"
            HTML_FILE=$(mktemp)

            if ! curl -fsSL --max-time 20 "$URL" -o "$HTML_FILE"; then
              echo "FAIL: Could not download HTML for $URL"
              FAILED=1
              rm -f "$HTML_FILE"
              continue
            fi

            if grep -Eiq '<title[^>]*>[^<]{1,}</title>' "$HTML_FILE"; then
              echo "PASS: Title found for $URL"
            else
              echo "FAIL: Missing or empty title for $URL"
              FAILED=1
            fi

            if grep -Eiq '<meta[^>]+name=["\x27]description["\x27][^>]+content=["\x27][^"\x27]{1,}' "$HTML_FILE" ||
               grep -Eiq '<meta[^>]+content=["\x27][^"\x27]{1,}["\x27][^>]+name=["\x27]description["\x27]' "$HTML_FILE"; then
              echo "PASS: Meta description found for $URL"
            else
              echo "FAIL: Missing or empty meta description for $URL"
              FAILED=1
            fi

            rm -f "$HTML_FILE"
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Some pages may need SEO metadata review."
            exit 1
          fi

          echo "SUCCESS: Titles and meta descriptions were detected on all checked pages."
```
