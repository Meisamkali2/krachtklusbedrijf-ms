```yaml
name: Website SEO Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

jobs:
  seo-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check website homepage
        run: |
          curl -fsSL --max-time 30 https://www.krachtklusbedrijf-ms.nl/ -o /dev/null
          echo "Homepage is accessible"

      - name: Check robots.txt
        run: |
          curl -fsSL --max-time 30 https://www.krachtklusbedrijf-ms.nl/robots.txt -o /dev/null
          echo "robots.txt is accessible"

      - name: Check sitemap.xml
        run: |
          curl -fsSL --max-time 30 https://www.krachtklusbedrijf-ms.nl/sitemap.xml -o /dev/null
          echo "sitemap.xml is accessible"
```
