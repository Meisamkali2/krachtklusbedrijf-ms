name: Website SEO and Build Check

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and SEO Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Check SEO source files
        shell: bash
        run: |
          set -e

          test -f app/robots.ts || {
            echo "ERROR: app/robots.ts is missing"
            exit 1
          }

          test -f app/sitemap.ts || {
            echo "ERROR: app/sitemap.ts is missing"
            exit 1
          }

          echo "SUCCESS: robots.ts and sitemap.ts exist."

      - name: Check generated SEO files
        shell: bash
        run: |
          set -e

          if [ ! -d .next/server/app ]; then
            echo "ERROR: Next.js server build output was not found."
            exit 1
          fi

          echo "Next.js server build output exists."
          echo "Build and SEO source checks completed successfully."
